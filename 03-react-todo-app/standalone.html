<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React To-Do List Application</title>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Standalone for JSX transformation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 3rem 1rem;
    }
    .app-card {
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      height: fit-content;
    }
    .header {
      margin-bottom: 1.75rem;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #818cf8;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    h1 { font-size: 1.8rem; font-weight: 800; }
    .subtitle { color: var(--text-muted); font-size: 0.9rem; }
    
    /* Input Form */
    .input-form {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .input-form input {
      flex: 1;
      background: rgba(9, 13, 22, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-form input:focus {
      border-color: var(--primary);
    }
    .btn-add {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 1.5rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-add:hover { background: var(--primary-hover); }

    /* Filter Controls */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--card-border);
      font-size: 0.85rem;
    }
    .filters {
      display: flex;
      gap: 0.5rem;
    }
    .filter-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--primary);
      color: #fff;
    }
    .clear-btn {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 0.8rem;
      font-family: inherit;
    }
    .clear-btn:hover { text-decoration: underline; }

    /* Todo Items */
    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(9, 13, 22, 0.5);
      border: 1px solid var(--card-border);
      padding: 0.75rem 1rem;
      border-radius: 10px;
      transition: all 0.2s;
    }
    .todo-item:hover {
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateX(2px);
    }
    .todo-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
    }
    .checkbox {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .todo-text {
      font-size: 0.95rem;
      color: var(--text);
      word-break: break-word;
    }
    .todo-text.completed {
      text-decoration: line-through;
      color: var(--text-muted);
    }
    .btn-delete {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px 8px;
      border-radius: 4px;
      transition: color 0.2s;
    }
    .btn-delete:hover {
      color: var(--danger);
    }
    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function TodoApp() {
      // 1. React State Hook for Todos (load initial state from localStorage)
      const [todos, setTodos] = useState(() => {
        const saved = localStorage.getItem('react_todos');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) { return []; }
        }
        return [
          { id: 1, text: 'Learn React Hooks (useState, useEffect)', completed: true },
          { id: 2, text: 'Build responsive To-Do component layout', completed: true },
          { id: 3, text: 'Implement LocalStorage persistence', completed: false },
          { id: 4, text: 'Connect frontend to RESTful API backend', completed: false }
        ];
      });

      const [inputValue, setInputValue] = useState('');
      const [filter, setFilter] = useState('all'); // 'all' | 'active' | 'completed'

      // 2. React useEffect Hook: Persist todos to localStorage whenever state changes
      useEffect(() => {
        localStorage.setItem('react_todos', JSON.stringify(todos));
      }, [todos]);

      // Add a new todo
      const handleAddTodo = (e) => {
        e.preventDefault();
        const trimmed = inputValue.trim();
        if (!trimmed) return;

        const newTodo = {
          id: Date.now(),
          text: trimmed,
          completed: false
        };

        setTodos([newTodo, ...todos]);
        setInputValue('');
      };

      // Toggle todo completed state
      const toggleTodo = (id) => {
        setTodos(
          todos.map(todo =>
            todo.id === id ? { ...todo, completed: !todo.completed } : todo
          )
        );
      };

      // Delete a todo
      const deleteTodo = (id) => {
        setTodos(todos.filter(todo => todo.id !== id));
      };

      // Clear completed todos
      const clearCompleted = () => {
        setTodos(todos.filter(todo => !todo.completed));
      };

      // Filtered todos based on active filter state
      const filteredTodos = todos.filter(todo => {
        if (filter === 'active') return !todo.completed;
        if (filter === 'completed') return todo.completed;
        return true;
      });

      const activeCount = todos.filter(t => !t.completed).length;

      return (
        <div className="app-card">
          <div className="header">
            <span className="badge">Practical 3: React.js</span>
            <h1>TaskFlow React</h1>
            <p className="subtitle">State management, event handlers & local storage sync.</p>
          </div>

          {/* Add Todo Form */}
          <form className="input-form" onSubmit={handleAddTodo}>
            <input
              type="text"
              placeholder="What needs to be done?"
              value={inputValue}
              onChange={(e) => setInputValue(e.target.value)}
              autoFocus
            />
            <button type="submit" className="btn-add">Add Task</button>
          </form>

          {/* Controls Bar */}
          <div className="controls">
            <span><strong>{activeCount}</strong> items remaining</span>
            <div className="filters">
              <button
                className={`filter-btn ${filter === 'all' ? 'active' : ''}`}
                onClick={() => setFilter('all')}
              >
                All
              </button>
              <button
                className={`filter-btn ${filter === 'active' ? 'active' : ''}`}
                onClick={() => setFilter('active')}
              >
                Active
              </button>
              <button
                className={`filter-btn ${filter === 'completed' ? 'active' : ''}`}
                onClick={() => setFilter('completed')}
              >
                Completed
              </button>
            </div>
            {todos.some(t => t.completed) && (
              <button className="clear-btn" onClick={clearCompleted}>
                Clear completed
              </button>
            )}
          </div>

          {/* Todo Items List */}
          <ul className="todo-list">
            {filteredTodos.length > 0 ? (
              filteredTodos.map(todo => (
                <li key={todo.id} className="todo-item">
                  <div className="todo-left">
                    <input
                      type="checkbox"
                      className="checkbox"
                      checked={todo.completed}
                      onChange={() => toggleTodo(todo.id)}
                    />
                    <span className={`todo-text ${todo.completed ? 'completed' : ''}`}>
                      {todo.text}
                    </span>
                  </div>
                  <button
                    className="btn-delete"
                    onClick={() => deleteTodo(todo.id)}
                    title="Delete task"
                  >
                    ✕
                  </button>
                </li>
              ))
            ) : (
              <div className="empty-state">
                No tasks found in this view.
              </div>
            )}
          </ul>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TodoApp />);
  </script>
</body>
</html>
